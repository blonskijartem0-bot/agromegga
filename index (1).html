<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline' https://accounts.google.com; style-src 'unsafe-inline' https://accounts.google.com; img-src data: https:; frame-src https://accounts.google.com; connect-src https://accounts.google.com https://www.googleapis.com https://youtubeanalytics.googleapis.com; form-action 'none'; base-uri 'none'">
<meta name="referrer" content="strict-origin">
<title>agromegaa</title>
<style>
:root{--bg:#0a0a0b;--bg2:#121214;--bg3:#1a1a1d;--line:#2a2a2f;--red:#e11d2e;--red2:#ff3b4d;--dark-red:#7a0f19;--tx:#f4f4f5;--mut:#9a9aa3;--ok:#3ddc84}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
body{background:radial-gradient(1200px 600px at 80% -10%,rgba(225,29,46,.18),transparent 60%),radial-gradient(900px 500px at -10% 110%,rgba(225,29,46,.10),transparent 60%),var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
.hidden{display:none!important}
.logo{font-weight:900;letter-spacing:.18em;text-transform:uppercase;font-size:20px}
.logo b{color:var(--red)}
.btn{background:var(--bg3);border:1px solid var(--line);border-radius:10px;padding:10px 16px;cursor:pointer;transition:.15s}
.btn:hover{border-color:var(--red);box-shadow:0 0 0 3px rgba(225,29,46,.15)}
.btn.primary{background:linear-gradient(135deg,var(--red),var(--dark-red));border-color:transparent;font-weight:700}
.btn.primary:hover{filter:brightness(1.15)}
.btn.sm{padding:6px 10px;font-size:13px}
.btn.danger{color:var(--red2)}
.btn:disabled{opacity:.5;cursor:not-allowed}
input,select,textarea{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:11px 12px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--red)}
label{display:block;font-size:12px;color:var(--mut);margin:12px 0 5px;text-transform:uppercase;letter-spacing:.08em}
/* auth */
.center{min-height:100%;display:flex;align-items:center;justify-content:center;padding:20px}
.card{width:100%;max-width:420px;background:linear-gradient(180deg,var(--bg2),var(--bg));border:1px solid var(--line);border-radius:18px;padding:30px;box-shadow:0 20px 60px rgba(0,0,0,.6),0 0 80px rgba(225,29,46,.08)}
.card h1{margin:0 0 6px;font-size:26px}
.card p{color:var(--mut);margin:0 0 20px;font-size:14px;line-height:1.5}
.sso{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;margin-bottom:10px;padding:12px;font-weight:600}
.sso svg{width:18px;height:18px}
.err{color:var(--red2);font-size:13px;min-height:18px;margin-top:10px}
.note{font-size:12px;color:var(--mut);margin-top:14px;line-height:1.5}
#gbtn{display:flex;justify-content:center;margin-bottom:10px;min-height:44px}
.sep{display:flex;align-items:center;gap:10px;color:var(--mut);font-size:12px;margin:16px 0}
.sep:before,.sep:after{content:"";flex:1;height:1px;background:var(--line)}
/* app */
header{display:flex;align-items:center;justify-content:space-between;padding:14px 22px;border-bottom:1px solid var(--line);background:rgba(10,10,11,.8);backdrop-filter:blur(8px);position:sticky;top:0;z-index:5}
.hr{display:flex;gap:10px;align-items:center}
.chip{font-size:13px;color:var(--mut);padding:6px 12px;border:1px solid var(--line);border-radius:99px;max-width:240px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.layout{display:grid;grid-template-columns:340px 1fr;height:calc(100vh - 62px)}
aside{border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;background:var(--bg2)}
.side-top{padding:14px;display:flex;flex-direction:column;gap:10px}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab{padding:5px 11px;border-radius:99px;border:1px solid var(--line);background:none;cursor:pointer;font-size:13px;color:var(--mut)}
.tab.on{background:var(--red);border-color:var(--red);color:#fff}
.list{overflow:auto;padding:0 10px 14px;flex:1}
.item{display:flex;gap:12px;align-items:center;padding:12px;border-radius:12px;cursor:pointer;border:1px solid transparent;margin-bottom:4px}
.item:hover{background:var(--bg3)}
.item.on{background:var(--bg3);border-color:var(--red);box-shadow:inset 3px 0 0 var(--red)}
.badge{width:40px;height:40px;border-radius:11px;display:grid;place-items:center;font-weight:800;font-size:13px;flex:none;background:var(--bg);border:1px solid var(--line)}
.badge.tiktok{color:#fff;box-shadow:inset 0 0 0 1px #25f4ee,2px 2px 0 #fe2c55}
.badge.instagram{background:linear-gradient(45deg,#7a0f19,#e11d2e 60%,#ff7a5c);color:#fff;border:none}
.badge.youtube{background:var(--red);color:#fff;border:none}
.badge.twitter{background:#000;color:#fff;border:1px solid #6b6b73;font-size:16px}
.meta{min-width:0;flex:1}
.meta .n{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta .e{font-size:12.5px;color:var(--red2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta .s{font-size:11.5px;color:var(--mut);margin-top:2px}
.qgo{flex:none;width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--bg);cursor:pointer;font-size:16px;display:grid;place-items:center;transition:.15s}
.qgo:hover{background:var(--red);border-color:var(--red)}
main{overflow:auto;padding:26px 30px}
.empty{height:100%;display:grid;place-items:center;text-align:center;color:var(--mut)}
.detail{max-width:1100px}
.dhead{display:flex;gap:16px;align-items:center;margin-bottom:18px;flex-wrap:wrap}
.dhead .badge{width:56px;height:56px;font-size:17px;border-radius:15px}
.dhead h2{margin:0;font-size:24px}
.dhead span{color:var(--mut);font-size:14px}
.dhead .go{margin-left:auto}
.wtabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:20px;padding-bottom:14px;border-bottom:1px solid var(--line)}
.wtab{padding:8px 16px;border-radius:10px;border:1px solid var(--line);background:var(--bg2);cursor:pointer;font-size:14px;color:var(--mut)}
.wtab:hover{border-color:var(--red)}
.wtab.on{background:linear-gradient(135deg,var(--red),var(--dark-red));border-color:transparent;color:#fff;font-weight:700}
.info{max-width:640px}
.row{background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.row .k{font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.08em}
.row .v{margin-top:3px;word-break:break-all;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:14px}
.actions{display:flex;gap:10px;margin-top:20px;flex-wrap:wrap}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.75);display:grid;place-items:center;padding:20px;z-index:20}
.modal .card{max-height:92vh;overflow:auto}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--red);padding:10px 18px;border-radius:10px;font-weight:600;z-index:50;box-shadow:0 10px 30px rgba(0,0,0,.5)}
/* progress */
.bar{height:12px;background:var(--bg);border:1px solid var(--line);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--dark-red),var(--red2));border-radius:99px;transition:width .4s}
.bar.big{height:18px}
.prog{background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:14px}
.prog-top{display:flex;align-items:baseline;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.prog-top b{font-size:28px}
.prog-top span{color:var(--mut);font-size:13px}
/* calendar */
.cal-wrap{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:22px;align-items:start}
.cal-head{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.cal-title{flex:1;font-size:18px;font-weight:700;text-transform:capitalize}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;margin-top:14px}
.dow{font-size:11px;color:var(--mut);text-align:center;text-transform:uppercase;padding:2px 0}
.day{min-height:64px;background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:6px;text-align:left;cursor:pointer;display:flex;flex-direction:column;justify-content:space-between;gap:4px}
.day:hover{border-color:var(--red)}
.day.today .num{color:var(--red2);font-weight:800}
.day.sel{border-color:var(--red);box-shadow:inset 0 0 0 1px var(--red),0 0 0 3px rgba(225,29,46,.15)}
.day.full{background:rgba(225,29,46,.14)}
.day .cnt{font-size:10.5px;color:var(--mut)}
.day .bar{height:5px}
.day.blank{visibility:hidden}
.day .dv{font-size:10.5px;color:var(--red2);font-weight:700;margin-top:2px}.day .dv.ok{color:var(--ok)}
.plate{background:var(--bg2);border:1px solid var(--red);border-radius:14px;padding:14px 16px;margin:12px 0}
.plate-top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:10px;flex-wrap:wrap}
.plate .l{font-size:12px;color:var(--mut);text-transform:uppercase;letter-spacing:.08em}
.plate .big b{font-size:34px;color:var(--tx)}.plate .big span{font-size:18px;color:var(--mut)}
.plate-btns{display:flex;gap:8px}
.plate-foot{display:flex;gap:16px;flex-wrap:wrap;justify-content:space-between;align-items:center;margin-top:10px;font-size:13px;color:var(--mut)}
.plate-foot input{width:64px;padding:4px 8px;margin-left:6px}
.task{display:flex;gap:8px;align-items:center;background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:5px 8px;margin-bottom:6px}
.task input[type=text]{border:none;background:transparent;padding:7px 6px}
.task input[type=time]{width:96px;flex:none;padding:6px 4px;font-size:12px}
.task.done input[type=text]{text-decoration:line-through;color:var(--mut)}
.chk{width:20px!important;height:20px;padding:0!important;accent-color:var(--red);flex:none;cursor:pointer}
.xbtn{background:none;border:none;color:var(--mut);cursor:pointer;font-size:16px;padding:4px 6px;border-radius:6px;flex:none}
.xbtn:hover{color:var(--red2);background:var(--bg3)}
.addrow{display:flex;gap:8px;margin-top:10px}
.addrow input[type=time]{width:110px;flex:none}
h3{margin:0 0 12px;font-size:16px}
/* quests */
.quest{background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:10px}
.quest.done{opacity:.6;border-color:var(--dark-red)}
.quest .qt{display:flex;gap:10px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap}
.quest h4{margin:0;font-size:16px}
.quest.done h4{text-decoration:line-through}
.quest .qd{color:var(--mut);font-size:13px;margin:4px 0 10px;white-space:pre-wrap}
.quest .qm{display:flex;justify-content:space-between;font-size:12.5px;color:var(--mut);margin-top:6px}
.qbtns{display:flex;gap:6px}
.late{color:var(--red2)}
/* stats */
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-bottom:16px}
.kpi{background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.kpi .l{font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.08em}
.kpi .v{font-size:26px;font-weight:800;margin:4px 0 2px}
.kpi .d{font-size:12px;color:var(--mut)}
.up{color:var(--ok)}.down{color:var(--red2)}
.chartbox{background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:16px}
.chartbox svg{width:100%;height:auto;display:block}
.ch-line{fill:none;stroke:var(--red);stroke-width:2.5}
.ch-area{fill:rgba(225,29,46,.15);stroke:none}
.ch-grid{stroke:var(--line);stroke-width:1}
.ch-t{fill:var(--mut);font-size:11px}
.ch-dot{fill:var(--bg);stroke:var(--red2);stroke-width:2}
.heat{display:grid;grid-template-rows:repeat(7,15px);grid-auto-flow:column;grid-auto-columns:15px;gap:4px;margin:10px 0}
.hc{border-radius:3px;background:var(--bg3)}
.hc.l1{background:rgba(225,29,46,.3)}.hc.l2{background:rgba(225,29,46,.6)}.hc.l3{background:var(--red2)}
.hc.fut{background:transparent}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th,.tbl td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:right}
.tbl th:first-child,.tbl td:first-child{text-align:left}
.tbl th{color:var(--mut);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.06em}
.box{background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:16px}
.shead{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.shead .sp{flex:1}
textarea.code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px}
/* журнал */
.lg{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:13.5px;align-items:flex-start}
.lg:last-child{border-bottom:none}
.lg-t{color:var(--mut);flex:none;width:82px;font-size:12px;padding-top:1px}
.lg-i{flex:none;width:20px;text-align:center}
.lg-m{flex:1;min-width:0;word-break:break-word}
.lg-day{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--mut);margin:14px 0 2px}
.lg-day:first-child{margin-top:0}
.rk{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:22px;letter-spacing:.08em;text-align:center;background:var(--bg);border:1px dashed var(--red);border-radius:12px;padding:16px 10px;margin:14px 0;user-select:all;word-break:break-all}
.prog-top .sp{flex:1}
.vb{font-size:11px;color:var(--mut)}.vb.ok{color:var(--ok)}
/* гайд */
.modal .card.wide{max-width:800px}
.gd{border:1px solid var(--line);border-radius:12px;margin-bottom:8px;background:var(--bg2)}
.gd summary{cursor:pointer;padding:13px 16px;font-weight:700;font-size:15px}
.gd[open] summary{color:var(--red2)}
.gd .gb{padding:0 16px 14px;color:#d4d4d8;font-size:14px;line-height:1.65}
.gd .gb p{margin:8px 0;color:#d4d4d8}
.gd .gb ul,.gd .gb ol{margin:6px 0 6px 20px;padding:0}
.gd .gb li{margin:4px 0}
.gd .gb b{color:var(--tx)}
@media(max-width:800px){header{padding:10px 14px;flex-wrap:wrap;gap:8px}.hr{flex-wrap:wrap;gap:6px}.lg-t{width:64px}.layout{grid-template-columns:1fr;height:auto}aside{border-right:none;border-bottom:1px solid var(--line);max-height:50vh}main{padding:18px}.chip{display:none}.cal-wrap{grid-template-columns:1fr}.day{min-height:54px}}
</style>
</head>

<script>
'use strict';
/* ===== НАЛАШТУВАННЯ ===== */
const CFG={GOOGLE_CLIENT_ID:'657778652488-dhmgc0hlrifuer396rgtjlh59oedhj8c.apps.googleusercontent.com'};
const AUTO_LOCK_MS=5*60*1000, PBKDF_ITER=600000, CLIP_MS=20000;
const PLAT={
  tiktok:{name:'TikTok',tag:'TT',login:'https://www.tiktok.com/login'},
  instagram:{name:'Instagram',tag:'IG',login:'https://www.instagram.com/accounts/login/'},
  youtube:{name:'YouTube',tag:'YT',login:'https://www.youtube.com/'},
  twitter:{name:'Twitter (X)',tag:'X',login:'https://x.com/i/flow/login'}
};
// Автовизначення платформи за посиланням на профіль (або за доменом у тексті)
function detectPlatform(raw){
  const s=String(raw).trim().replace(/[?#].*$/,'');
  const rules=[
    ['tiktok',/tiktok\.com\/@([\w.]+)/i,/tiktok\.com/i],
    ['instagram',/instagram\.com\/(?!p\/|reel\/|stories\/|explore\/)([\w.]+)/i,/instagram\.com|instagr\.am/i],
    ['youtube',/youtube\.com\/(?:@|c\/|user\/|channel\/)([\w.\-]+)/i,/youtube\.com|youtu\.be/i],
    ['twitter',/(?:^|[/.@])(?:twitter|x)\.com\/(?!i\/|home|intent|share|search)@?(\w+)/i,/(?:^|[/.@])(?:twitter|x)\.com/i]
  ];
  for(const[platform,full,host]of rules){
    const m=s.match(full);
    if(m)return{platform,handle:'@'+m[1]};
    if(host.test(s))return{platform,handle:null};
  }
  return null;
}
const METRICS=[['subs','Підписники'],['views','Перегляди'],['likes','Лайки'],['comments','Коментарі'],['posts','Публікації']];
const $=id=>document.getElementById(id);
const S={user:null,key:null,salt:null,accounts:[],sel:null,filter:'all',search:'',fails:0,lockTimer:null,tab:'info',cal:null,day:null,metric:'subs',logf:'all',rk:null,ext:null,yt:null};

function h(tag,attrs,...kids){const e=document.createElement(tag);for(const k in(attrs||{})){if(k==='class')e.className=attrs[k];else if(k.startsWith('on'))e.addEventListener(k.slice(2),attrs[k]);else e.setAttribute(k,attrs[k])}kids.flat().forEach(c=>{if(c===false||c==null)return;e.append(c instanceof Node?c:document.createTextNode(c))});return e}
function toast(t){const d=h('div',{class:'toast'},t);d.style.bottom=(24+document.querySelectorAll('.toast').length*54)+'px';document.body.append(d);setTimeout(()=>d.remove(),3200)}
function show(id){['auth','unlock','app'].forEach(s=>$(s).classList.toggle('hidden',s!==id))}
const uid=()=>crypto.randomUUID();
const fmt=n=>n==null?'—':Number(n).toLocaleString('uk-UA');
const p2=n=>String(n).padStart(2,'0');
const dk=d=>d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate());
const pd=k=>{const[y,m,d]=k.split('-').map(Number);return new Date(y,m-1,d)};
const numOrNull=v=>{v=String(v).trim();if(v==='')return null;const n=Math.floor(Number(v));return Number.isFinite(n)&&n>=0?n:NaN};

/* ===== КРИПТО ===== */
const enc=new TextEncoder(),dec=new TextDecoder();
const b64=b=>btoa(String.fromCharCode(...new Uint8Array(b)));
const unb64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function deriveKey(pw,salt){
  const base=await crypto.subtle.importKey('raw',enc.encode(pw),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:PBKDF_ITER,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);
}
async function seal(){
  const iv=crypto.getRandomValues(new Uint8Array(12));
  const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},S.key,enc.encode(JSON.stringify(S.accounts)));
  localStorage.setItem(vaultKey(),JSON.stringify({v:1,salt:b64(S.salt),iv:b64(iv),data:b64(ct),...(S.rk?{rk:S.rk}:{})}));
  regIdx();
}
// Кожен акаунт має власні план, квести, статистику й журнал дій (старі акаунти доповнюються автоматично)
function ensure(a){a.plans=a.plans&&typeof a.plans==='object'&&!Array.isArray(a.plans)?a.plans:{};a.quests=Array.isArray(a.quests)?a.quests:[];a.stats=Array.isArray(a.stats)?a.stats:[];a.ytKey=a.ytKey||'';a.log=Array.isArray(a.log)?a.log:[];a.link=typeof a.link==='string'?a.link:'';a.loginId=typeof a.loginId==='string'?a.loginId:'';a.daily=a.daily&&typeof a.daily==='object'&&!Array.isArray(a.daily)?a.daily:{};a.goal=Number.isInteger(a.goal)&&a.goal>0?a.goal:1;return a}
// Журнал дій: кожна зміна в акаунті записується сюди
const LOGCAP=300;
function act(a,kind,msg){a.log.push({t:Date.now(),k:kind,m:String(msg).slice(0,300)});if(a.log.length>LOGCAP)a.log.splice(0,a.log.length-LOGCAP)}
async function openVault(pw,rec){
  const salt=unb64(rec.salt),key=await deriveKey(pw,salt);
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(rec.iv)},key,unb64(rec.data));
  S.key=key;S.salt=salt;S.rk=rec.rk&&rec.rk.salt&&rec.rk.iv&&rec.rk.data?rec.rk:null;S.accounts=JSON.parse(dec.decode(pt)).map(ensure);
}
// Сховище прив'язане до користувача (провайдер + унікальний id): інший користувач не бачить чужих даних
const vk=(p,s)=>'agromegaa:vault:'+p+':'+s;
const vaultKey=()=>vk(S.user.provider,S.user.sub);
// Індекс сховищ на цьому пристрої: за поштою знаходимо те саме сховище незалежно від способу входу (Google чи пошта)
const IDX='agromegaa:idx';
function readIdx(){try{const j=JSON.parse(localStorage.getItem(IDX)||'[]');return Array.isArray(j)?j:[]}catch{return[]}}
function regIdx(){
  try{
    const e=String(S.user.email||'').toLowerCase(),l=readIdx();
    if(!e||l.some(x=>x.provider===S.user.provider&&x.sub===S.user.sub))return;
    l.push({provider:S.user.provider,sub:S.user.sub,email:e});localStorage.setItem(IDX,JSON.stringify(l));
  }catch{}
}
function vaultsFor(email){
  const e=String(email||'').toLowerCase(),out=[];
  readIdx().forEach(x=>{if(x.email===e&&localStorage.getItem(vk(x.provider,x.sub))&&!out.some(o=>o.provider===x.provider&&o.sub===x.sub))out.push(x)});
  if(localStorage.getItem(vk('demo',e))&&!out.some(o=>o.provider==='demo'&&o.sub===e))out.push({provider:'demo',sub:e,email:e}); // старі сховища без індексу
  return out;
}
const maskEmail=e=>{const[l,d]=String(e).split('@');return d?l.slice(0,2)+'***@'+d:String(e)};
function knownEmails(){
  const set=new Set();
  readIdx().forEach(x=>{if(localStorage.getItem(vk(x.provider,x.sub)))set.add(x.email)});
  for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k&&k.startsWith('agromegaa:vault:demo:'))set.add(k.slice(21))}
  return[...set];
}
const provLabel=p=>p==='google'?'Google':'пошта';

/* ===== ВХІД ===== */
function jwt(t){const p=t.split('.')[1].replace(/-/g,'+').replace(/_/g,'/');return JSON.parse(decodeURIComponent(atob(p).split('').map(c=>'%'+c.charCodeAt(0).toString(16).padStart(2,'0')).join('')))}
function loginAs(u,login){sessionStorage.setItem('agro:user',JSON.stringify(u));S.user=u;goUnlock(login)}
function loadScript(src){return new Promise((ok,no)=>{const s=document.createElement('script');s.src=src;s.async=true;s.onload=ok;s.onerror=no;document.head.append(s)})}

async function initAuth(){
  const hasG=!!CFG.GOOGLE_CLIENT_ID;
  $('authNote').textContent=hasG?'':'Вкажи GOOGLE_CLIENT_ID на початку скрипта, щоб увімкнути вхід через Google.';
  $('gbtn').classList.toggle('hidden',!hasG);
  $('googleFallback').classList.toggle('hidden',hasG);
  if(hasG){
    try{
      await loadScript('https://accounts.google.com/gsi/client');
      google.accounts.id.initialize({client_id:CFG.GOOGLE_CLIENT_ID,callback:r=>{
        try{const p=jwt(r.credential);if(p.aud!==CFG.GOOGLE_CLIENT_ID)throw 0;loginAs({provider:'google',sub:p.sub,email:String(p.email||'').toLowerCase(),name:p.name||p.email,verified:p.email_verified!==false})}catch{$('authErr').textContent='Помилка входу через Google'}
      }});
      google.accounts.id.renderButton($('gbtn'),{theme:'filled_black',size:'large',text:'continue_with',width:340});
    }catch{$('authErr').textContent='Не вдалося завантажити Google'}
  }
  $('googleFallback').onclick=()=>$('authErr').textContent='Вкажи GOOGLE_CLIENT_ID у налаштуваннях, щоб увімкнути Google-вхід.';
  $('demoBtn').onclick=()=>demoGo(false);
  $('demoLogin').onclick=()=>demoGo(true);
  function demoGo(login){
    const e=$('demoEmail').value.trim().toLowerCase();
    if(!/^\S+@\S+\.\S+$/.test(e)){$('authErr').textContent='Введи коректну пошту';return}
    loginAs({provider:'demo',sub:e,email:e,name:e},login);
  }
}

/* ===== РОЗБЛОКУВАННЯ ===== */
function goUnlock(login){
  S.key=null;S.accounts=[];S.fails=0;
  let has=!!localStorage.getItem(vaultKey());
  const cands=vaultsFor(S.user.email);
  // Є сховище з тією самою поштою, але створене іншим способом входу — відкриваємо його
  if(!has&&cands.length&&S.user.verified!==false){
    S.user={...S.user,provider:cands[0].provider,sub:cands[0].sub};
    sessionStorage.setItem('agro:user',JSON.stringify(S.user));has=true;
  }
  if(has)regIdx();
  const missing=login===true&&!has;
  $('ulMain').classList.toggle('hidden',missing);
  $('ulMissing').classList.toggle('hidden',!missing);
  $('ulLogin').classList.toggle('hidden',has);
  $('ulForgot').classList.toggle('hidden',!has);
  // Якщо для цієї пошти є кілька сховищ — даємо вибрати
  const ch=$('ulChoose');ch.replaceChildren();
  const all=vaultsFor(S.user.email);
  ch.classList.toggle('hidden',all.length<2);
  if(all.length>1){
    ch.append(h('div',{class:'note',style:'margin:0 0 8px'},'Для цієї пошти на пристрої знайдено кілька сховищ. Обери потрібне:'));
    all.forEach(c=>ch.append(h('button',{class:'btn'+(c.provider===S.user.provider&&c.sub===S.user.sub?' primary':''),style:'width:100%;margin-bottom:6px',onclick:()=>{S.user={...S.user,provider:c.provider,sub:c.sub};sessionStorage.setItem('agro:user',JSON.stringify(S.user));goUnlock(login)}},'Сховище · вхід через '+provLabel(c.provider))));
  }
  if(missing){
    const others=knownEmails().filter(e=>e!==String(S.user.email).toLowerCase());
    $('ulTitle').textContent='Обліковий запис не знайдено';
    $('ulText').textContent='Для '+S.user.email+' на цьому пристрої немає збереженого сховища: дані зберігаються лише в браузері, де ти реєструвався.'
      +(others.length?' Тут збережені сховища для: '+others.map(maskEmail).join(', ')+'. Можливо, ти ввів іншу пошту, перевір її або увійди через Google.':'')
      +' Якщо акаунт створено на іншому пристрої чи в іншому браузері, відновіть його з резервної копії (кнопка ⬇ у додатку) або створи новий.';
  }else{
    $('ulTitle').textContent=has?'Розблокуй сховище':'Створи майстер-пароль';
    $('ulText').textContent=(has?'Привіт, ':'Вітаємо, ')+S.user.email+(has?'. Введи майстер-пароль.':'. Цей пароль шифрує всі твої акаунти. Мінімум 10 символів.');
  }
  $('mp2wrap').classList.toggle('hidden',has);
  $('mp1').value='';$('mp2').value='';$('ulErr').textContent='';
  show('unlock');if(!missing)$('mp1').focus();
}

  const f=e.target.files[0];e.target.value='';if(!f)return;
  try{

/* ===== ВІДНОВЛЕННЯ ДОСТУПУ (ключ відновлення) ===== */
// Ключ відновлення зашифровує майстер-пароль і зберігається разом зі сховищем (разом із резервною копією).
// Знаючи ключ, можна задати новий майстер-пароль. Сам ключ ніде не зберігається.
const RK_ALPHA='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
function genRecoveryKey(){const b=crypto.getRandomValues(new Uint8Array(20));let s='';b.forEach(x=>{s+=RK_ALPHA[x%32]});return s.match(/.{5}/g).join('-')}
const normRk=k=>String(k).toUpperCase().replace(/[^A-Z0-9]/g,'');
async function makeRk(pw,rkText){
  const salt=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12));
  const key=await deriveKey(normRk(rkText),salt);
  const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},key,enc.encode(pw));
  return{salt:b64(salt),iv:b64(iv),data:b64(ct)};
}
async function readRk(rk,rkText){
  const key=await deriveKey(normRk(rkText),unb64(rk.salt));
  return dec.decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(rk.iv)},key,unb64(rk.data)));
}
async function verifyPw(pw){
  try{const rec=JSON.parse(localStorage.getItem(vaultKey()));const key=await deriveKey(pw,unb64(rec.salt));await crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(rec.iv)},key,unb64(rec.data));return true}catch{return false}
}
function downloadText(name,text){const a=h('a',{href:URL.createObjectURL(new Blob([text],{type:'text/plain'})),download:name});document.body.append(a);a.click();a.remove()}
function recoveryModal(rkText,first){
  const root=$('modalRoot');
  const chk=h('input',{type:'checkbox',class:'chk'});
  const btn=h('button',{class:'btn primary',disabled:'',onclick:()=>root.replaceChildren()},'Готово');
  chk.addEventListener('change',()=>{if(chk.checked)btn.removeAttribute('disabled');else btn.setAttribute('disabled','')});
  root.replaceChildren(h('div',{class:'modal'},h('div',{class:'card'},
    h('h1',{},'Ключ відновлення'),
    h('p',{style:'margin-top:8px'},first?'Збережи цей ключ у надійному місці (менеджер паролів, роздруківка), але не лише на цьому пристрої. Якщо забудеш майстер-пароль, цей ключ єдиний спосіб повернути доступ до даних. Він показується лише один раз.':'Новий ключ створено, старий більше не працює. Збережи новий у надійному місці: він показується лише один раз.'),
    h('div',{class:'rk'},rkText),
    h('div',{class:'actions',style:'margin-top:12px'},
      h('button',{class:'btn',onclick:()=>copy(rkText,'Ключ')},'Копіювати'),
      h('button',{class:'btn',onclick:()=>downloadText('agromegaa-recovery-key.txt','agromegaa: ключ відновлення\nАкаунт: '+S.user.email+'\nКлюч: '+rkText+'\n\nЗберігай у надійному місці. Хто має цей ключ і резервну копію даних, може відкрити сховище.\n')},'Завантажити .txt')),
    h('label',{style:'display:flex;gap:10px;align-items:center;text-transform:none;letter-spacing:0;font-size:14px;color:var(--tx);margin-top:16px;cursor:pointer'},chk,'Я зберіг ключ відновлення'),
    h('div',{class:'actions'},btn))));
}
function forgotDialog(){
  const rk=h('input',{type:'text',autocomplete:'off',placeholder:'XXXXX-XXXXX-XXXXX-XXXXX'});
  const p1=h('input',{type:'password',autocomplete:'new-password'}),p2=h('input',{type:'password',autocomplete:'new-password'});
  dialog('Відновлення доступу',[
    h('p',{style:'margin-top:8px'},'Введи ключ відновлення, який ти зберіг при створенні сховища, і придумай новий майстер-пароль. Твої акаунти й дані не зміняться.'),
    ...field('Ключ відновлення',rk),...field('Новий майстер-пароль (мінімум 10 символів)',p1),...field('Повтори новий пароль',p2)],
  async()=>{
    let rec;try{rec=JSON.parse(localStorage.getItem(vaultKey()))}catch{rec=null}
    if(!rec)return'Сховище не знайдено';
    if(!rec.rk)return'Для цього сховища ключ відновлення не створено. Лишається відновлення з резервної копії або створення нового сховища.';
    if(p1.value.length<10)return'Новий пароль: мінімум 10 символів';
    if(p1.value!==p2.value)return'Паролі не збігаються';
    let oldPw;
    try{oldPw=await readRk(rec.rk,rk.value);await openVault(oldPw,rec)}catch{return'Ключ відновлення не підійшов. Перевір, чи немає помилок у символах'}
    S.salt=crypto.getRandomValues(new Uint8Array(16));S.key=await deriveKey(p1.value,S.salt);S.rk=await makeRk(p1.value,rk.value);
    await seal();
    setTimeout(()=>{startApp();toast('Майстер-пароль змінено, доступ відновлено')},0);
  },'Відновити');
}

function rkDialog(){
  const pw=h('input',{type:'password',autocomplete:'off'});
  dialog(S.rk?'Новий ключ відновлення':'Ключ відновлення',[
    h('p',{style:'margin-top:8px'},'Введи поточний майстер-пароль, щоб створити ключ відновлення. Якщо ключ уже був, він перестане працювати.'),...field('Майстер-пароль',pw)],
  async()=>{
    if(!(await verifyPw(pw.value)))return'Невірний майстер-пароль';
    const rkText=genRecoveryKey();S.rk=await makeRk(pw.value,rkText);await seal();
    setTimeout(()=>recoveryModal(rkText,false),0);
  },'Створити');
}
function pwDialog(){

    ...field('Поточний майстер-пароль',cur),...field('Новий майстер-пароль (мінімум 10 символів)',n1),...field('Повтори новий пароль',n2),
    h('div',{class:'note'},'Після зміни пароля буде створено новий ключ відновлення, а старий перестане працювати. Старі резервні копії відкриваються старим паролем.')],

    toast('Майстер-пароль змінено');
    setTimeout(()=>recoveryModal(rkText,false),0);
  },'Змінити');
}

/* ===== РОЗШИРЕННЯ CHROME (автовхід) ===== */
// Сайт спілкується з розширенням через window.postMessage. Пароль передається лише при натисканні «Увійти в акаунт».
const EXT_TARGET=(location.protocol==='file:'||location.origin==='null')?'*':location.origin;
const extWait={};
window.addEventListener('message',e=>{
  if(e.source!==window)return;
  const d=e.data;if(!d||d.source!=='agromegaa-ext')return;
  if(d.type==='PONG'){S.ext=String(d.version||'1');setExtChip()}
  if(d.type==='LOGIN_ACK'&&extWait[d.id]){extWait[d.id](d);delete extWait[d.id]}
});
function pingExt(){try{window.postMessage({source:'agromegaa-site',type:'PING',id:uid()},EXT_TARGET)}catch{}}
function extSend(type,payload,timeout){
  return new Promise(res=>{
    const id=uid(),t=setTimeout(()=>{delete extWait[id];res(null)},timeout);
    extWait[id]=r=>{clearTimeout(t);res(r)};
    window.postMessage({source:'agromegaa-site',id,type,...payload},EXT_TARGET);
  });
}
function setExtChip(){
  const b=$('extChip');if(!b)return;
  b.textContent=S.ext?'🧩 Розширення: увімкнено':'🧩 Розширення: немає';
  b.style.color=S.ext?'var(--ok)':'';b.style.borderColor=S.ext?'var(--ok)':'';
}

/* ===== ДОПОМІЖНЕ ===== */
const validLink=l=>typeof l==='string'&&/^https:\/\/[^\s]+$/i.test(l)&&!!detectPlatform(l);
// Тимчасові ніки TikTok на кшталт user9358023884568 зазвичай не мають відкритої сторінки профілю
const tempNick=a=>a.platform==='tiktok'&&/^@?user\d{8,}$/i.test(String(a.username).trim());
const fd=k=>pd(k).toLocaleDateString('uk-UA',{day:'numeric',month:'long'});
function profileUrl(a){
  if(validLink(a.link))return a.link;
  const u=encodeURIComponent(String(a.username).replace(/^@/,'').trim());
  if(a.platform==='tiktok')return 'https://www.tiktok.com/@'+u;
  if(a.platform==='instagram')return 'https://www.instagram.com/'+u+'/';
  if(a.platform==='twitter')return 'https://x.com/'+u;
  return 'https://www.youtube.com/@'+u;
}
// Один клік: з розширенням Chrome — сторінка входу відкривається і логін/пароль вводяться самі; без нього — відкриваємо сторінку і копіюємо пароль
async function quickOpen(a){
  if(S.ext&&a.password){
    const r=await extSend('LOGIN',{account:{platform:a.platform,identifier:a.loginId||a.email,password:a.password,secondary:String(a.username).replace(/^@/,'')}},4000);
    if(r&&r.ok){toast('Розширення виконує вхід. Капчу чи код підтвердження введи сам');commit(()=>act(a,'open','Автовхід через розширення ('+PLAT[a.platform].name+')'),false);return}
    toast('Розширення не відповіло'+(r&&r.error?': '+r.error:'')+'. Відкриваю звичайним способом');
  }
  let url=profileUrl(a),loginPage=false;
  if(!validLink(a.link)&&tempNick(a)){url=PLAT[a.platform].login;loginPage=true;toast('Схоже на тимчасовий нік TikTok: відкриваю сторінку входу. Додай посилання на профіль у «Редагувати»')}
  window.open(url,'_blank','noopener,noreferrer');
  if(a.password)copy(a.password,'Пароль');
  commit(()=>act(a,'open','Відкрито '+PLAT[a.platform].name+(loginPage?' (сторінка входу)':validLink(a.link)?' (за посиланням на профіль)':'')),false);
}
function copy(text,label){
  navigator.clipboard.writeText(text).then(()=>{toast(label+' скопійовано'+(label==='Пароль'?' (очиститься через 20 с)':''));
    if(label==='Пароль')setTimeout(()=>navigator.clipboard.writeText(' ').catch(()=>{}),CLIP_MS)}).catch(()=>toast('Не вдалося скопіювати'));
}
async function commit(fn,re=true){fn();try{await seal()}catch{toast('Не вдалося зберегти')}if(re)rerender()}
function dayStats(a,k){const l=a.plans[k]||[];const done=l.filter(t=>t.done).length;return{total:l.length,done,pct:l.length?Math.round(done*100/l.length):0}}
function bar(pct,cls){return h('div',{class:'bar '+(cls||'')},h('i',{style:'width:'+Math.max(0,Math.min(100,pct))+'%'}))}
function dialog(title,nodes,onSave,label){
  const root=$('modalRoot'),err=h('div',{class:'err'});
  const close=()=>root.replaceChildren();
  root.replaceChildren(h('div',{class:'modal',onclick:e=>{if(e.target.classList.contains('modal'))close()}},h('div',{class:'card'},
    h('h1',{},title),...nodes,err,
    h('div',{class:'actions'},
      h('button',{class:'btn primary',onclick:async()=>{try{const r=await onSave();if(r)err.textContent=r;else close()}catch(e){err.textContent=e.message||'Помилка'}}},label||'Зберегти'),
      h('button',{class:'btn',onclick:close},'Скасувати')))));
  const f=root.querySelector('input,textarea');if(f)f.focus();
}
const field=(lbl,el)=>[h('label',{},lbl),el];

/* ===== СПИСОК І ГОЛОВНИЙ ЕКРАН ===== */
function startApp(){$('who').textContent=S.user.email+' ('+provLabel(S.user.provider)+')';S.sel=null;S.tab='info';show('app');renderTabs();render();bump()}
function renderTabs(){
  const t=$('tabs');t.replaceChildren();
  [['all','Усі'],...Object.entries(PLAT).map(([k,v])=>[k,v.name])].forEach(([k,n])=>{
    const cnt=k==='all'?S.accounts.length:S.accounts.filter(a=>a.platform===k).length;
    t.append(h('button',{class:'tab'+(S.filter===k?' on':''),onclick:()=>{S.filter=k;renderTabs();render()}},n+' '+cnt));

function renderList(){
  const l=$('list');l.replaceChildren();
  const q=S.search.toLowerCase(),today=dk(new Date());
  const items=S.accounts.filter(a=>(S.filter==='all'||a.platform===S.filter)&&(!q||a.username.toLowerCase().includes(q)||a.email.toLowerCase().includes(q)));
  if(!items.length)l.append(h('div',{class:'note',style:'padding:16px;text-align:center'},'Акаунтів немає'));

    l.append(h('div',{class:'item'+(a.id===S.sel?' on':''),onclick:()=>{S.sel=a.id;render()}},
      h('div',{class:'badge '+a.platform},PLAT[a.platform].tag),
      h('div',{class:'meta'},h('div',{class:'n'},a.username),h('div',{class:'e'},a.email),
        h('div',{class:'s'},dailyWord(a).one+': '+dailyN(a,today)+'/'+a.goal),
        st.total?h('div',{class:'s'},'Сьогодні: '+st.done+'/'+st.total+' ('+st.pct+'%)'):null),
      h('button',{class:'qgo',title:'Увійти в акаунт одним кліком',onclick:e=>{e.stopPropagation();quickOpen(a)}},'↗')));
  });
}
function render(){renderList();renderDetail()}
function rerender(){const mm=$('main'),y=mm.scrollTop;renderDetail();mm.scrollTop=y;renderList()}
$('q').oninput=e=>{S.search=e.target.value;renderList()};

function renderDetail(){
  const m=$('main');m.replaceChildren();
  const a=S.accounts.find(x=>x.id===S.sel);
  if(!a){m.append(h('div',{class:'empty'},h('div',{},h('div',{style:'font-size:44px;color:var(--red)'},'◆'),h('p',{},'Обери акаунт зі списку або додай новий'))));return}
  const tabs=[['info','Огляд'],['cal','Календар'],['quests','Квести'],['stats','Статистика'],['log','Журнал'],['ai','ШІ-агент']];
  const body=h('div',{});
  m.append(h('div',{class:'detail'},
    h('div',{class:'dhead'},h('div',{class:'badge '+a.platform},PLAT[a.platform].tag),h('div',{},h('h2',{},a.username),h('span',{},PLAT[a.platform].name+' · '+a.email)),
      h('button',{class:'btn primary go',onclick:()=>quickOpen(a)},'Увійти в акаунт ↗')),
    h('div',{class:'wtabs'},tabs.map(([k,n])=>h('button',{class:'wtab'+(S.tab===k?' on':''),onclick:()=>{S.tab=k;rerender()}},n))),
    body));
  ({info:viewInfo,cal:viewCal,quests:viewQuests,stats:viewStats,log:viewLog,ai:viewAI}[S.tab]||viewInfo)(a,body);
}

/* ===== ВКЛАДКА: ЖУРНАЛ ДІЙ ===== */
const KINDS={acc:['👤','Акаунт'],cal:['📅','Календар'],quest:['🎯','Квести'],stat:['📈','Статистика'],open:['↗','Входи'],ai:['🤖','ШІ-агент']};
function logRow(e){
  const d=new Date(e.t),kd=KINDS[e.k]||['•',''];
  return h('div',{class:'lg'},h('span',{class:'lg-t'},d.toLocaleTimeString('uk-UA',{hour:'2-digit',minute:'2-digit'})+' '+d.toLocaleDateString('uk-UA',{day:'2-digit',month:'2-digit'})),h('span',{class:'lg-i'},kd[0]),h('span',{class:'lg-m'},e.m));

function viewLog(a,box){

  box.append(h('div',{class:'shead'},h('h3',{style:'margin:0'},'Журнал дій'),h('span',{class:'note',style:'margin:0'},a.log.length?'записів: '+a.log.length+' (зберігаються останні '+LOGCAP+')':''),h('div',{class:'sp'}),
    a.log.length?h('button',{class:'btn sm danger',onclick:()=>{if(confirm('Очистити журнал цього акаунта?'))commit(()=>{a.log=[]})}},'Очистити'):null),chips);

/* ===== ВКЛАДКА: КАЛЕНДАР ===== */
// Щоденний лічильник: відео (TikTok, Instagram, YouTube) або пости (Twitter/X)
const dailyWord=a=>a.platform==='twitter'?{one:'Пости',low:'постів'}:{one:'Відео',low:'відео'};
const dailyN=(a,k)=>Math.max(0,Number(a.daily[k])||0);
// Якщо кількість публікацій у статистиці зросла проти попереднього запису, додаємо різницю в лічильник дня
function syncDaily(a,rec){
  if(rec.posts==null)return;
  const prev=[...a.stats].filter(x=>x.d<rec.d&&x.posts!=null).sort((x,y)=>x.d<y.d?-1:1).pop();
  if(!prev)return;
  const delta=rec.posts-prev.posts;
  if(delta>0&&dailyN(a,rec.d)<delta){a.daily[rec.d]=delta;act(a,'cal',dailyWord(a).one+' за '+fd(rec.d)+' оновлено зі статистики: '+delta)}
}
function setDaily(a,k,v){
  v=Math.max(0,Math.min(999,v));const old=dailyN(a,k);if(v===old)return;
  return commit(()=>{if(v)a.daily[k]=v;else delete a.daily[k];act(a,'cal',dailyWord(a).one+' за '+fd(k)+': '+old+' → '+v)});
}
function viewCal(a,box){
  const now=new Date(),todayK=dk(now);
  if(!S.cal)S.cal={y:now.getFullYear(),m:now.getMonth()};
  if(!S.day)S.day=todayK;
  const{y,m}=S.cal;
  const nav=d=>{let nm=S.cal.m+d,ny=S.cal.y;if(nm<0){nm=11;ny--}if(nm>11){nm=0;ny++}S.cal={y:ny,m:nm};rerender()};
  const dim=new Date(y,m+1,0).getDate();let mt=0,md=0;
  for(let d=1;d<=dim;d++){const s=dayStats(a,dk(new Date(y,m,d)));mt+=s.total;md+=s.done}
  const mp=mt?Math.round(md*100/mt):0;
  let mv=0,mvDays=0;for(let d=1;d<=dim;d++){const n=dailyN(a,dk(new Date(y,m,d)));mv+=n;if(n)mvDays++}
  const W=dailyWord(a);

  const grid=h('div',{class:'cal'});
  ['Пн','Вт','Ср','Чт','Пт','Сб','Нд'].forEach(n=>grid.append(h('div',{class:'dow'},n)));
  const lead=(new Date(y,m,1).getDay()+6)%7;
  for(let i=0;i<lead;i++)grid.append(h('div',{class:'day blank'}));
  for(let d=1;d<=dim;d++){
    const k=dk(new Date(y,m,d)),st=dayStats(a,k);
    grid.append(h('button',{class:'day'+(k===S.day?' sel':'')+(k===todayK?' today':'')+(st.total&&st.done===st.total?' full':''),onclick:()=>{S.day=k;rerender()}},
      h('span',{class:'num'},String(d)),
      st.total?h('div',{},bar(st.pct),h('div',{class:'cnt'},st.done+'/'+st.total)):null,
      dailyN(a,k)?h('div',{class:'dv'+(dailyN(a,k)>=a.goal?' ok':'')},(a.platform==='twitter'?'✎ ':'▶ ')+dailyN(a,k)):null));
  }

  const dn=dailyN(a,S.day),isToday=S.day===todayK,dpct=Math.min(100,Math.round(dn*100/a.goal));
  const goalIn=h('input',{type:'number',min:'1',max:'999',value:String(a.goal),title:'Денна ціль',onchange:async e=>{const v=parseInt(e.target.value,10);if(!(v>=1&&v<=999)){e.target.value=String(a.goal);return}if(v===a.goal)return;const old=a.goal;await commit(()=>{a.goal=v;act(a,'cal','Денна ціль ('+W.low+'): '+old+' → '+v)})}});
  const plate=h('div',{class:'plate'},
    h('div',{class:'plate-top'},h('div',{},h('div',{class:'l'},W.one+(isToday?' за сьогодні':' за '+fd(S.day))),h('div',{class:'big'},h('b',{},String(dn)),h('span',{},' / '+a.goal))),
      h('div',{class:'plate-btns'},h('button',{class:'btn',onclick:()=>setDaily(a,S.day,dn-1),...(dn?{}:{disabled:''})},'−'),h('button',{class:'btn primary',onclick:()=>setDaily(a,S.day,dn+1)},'+ '+(a.platform==='twitter'?'пост':'відео')))),
    bar(dpct,'big'),
    h('div',{class:'plate-foot'},h('span',{},dn>=a.goal?'Ціль дня виконано':'До цілі: '+(a.goal-dn)),h('span',{},'Ціль на день: ',goalIn),h('span',{},'За '+new Date(y,m,1).toLocaleDateString('uk-UA',{month:'long'})+': '+mv+' ('+mvDays+' дн.)')));
  const left=h('div',{},
    h('div',{class:'cal-head'},
      h('button',{class:'btn sm',onclick:()=>nav(-1)},'‹'),
      h('div',{class:'cal-title'},new Date(y,m,1).toLocaleDateString('uk-UA',{month:'long',year:'numeric'})),
      h('button',{class:'btn sm',onclick:()=>nav(1)},'›'),
      h('button',{class:'btn sm',onclick:()=>{S.cal={y:now.getFullYear(),m:now.getMonth()};S.day=todayK;rerender()}},'Сьогодні')),
    h('div',{class:'prog'},
      h('div',{class:'prog-top'},h('b',{},mp+'%'),h('span',{},mt?'плану місяця виконано ('+md+' із '+mt+') · залишилось '+(100-mp)+'%':'на цей місяць планів ще немає')),
      bar(mp)),
    plate,
    grid);

  // панель дня
  const list=(a.plans[S.day]||[]),st=dayStats(a,S.day);
  const sorted=[...list].sort((x,y2)=>(x.time||'99:99')<(y2.time||'99:99')?-1:1);
  const txt=h('input',{type:'text',id:'newTask',placeholder:'Нове завдання…',maxlength:'200'});
  const tm=h('input',{type:'time'});
  const add=async()=>{const v=txt.value.trim();if(!v)return;await commit(()=>{(a.plans[S.day]=a.plans[S.day]||[]).push({id:uid(),t:v,time:tm.value||'',done:false});act(a,'cal','Додано завдання «'+v+'» на '+fd(S.day)+(tm.value?' о '+tm.value:''))});const i=$('newTask');if(i)i.focus()};
  txt.addEventListener('keydown',e=>{if(e.key==='Enter')add()});
  const prev=dk(new Date(pd(S.day).getTime()-864e5+(pd(S.day).getTimezoneOffset()-new Date(pd(S.day).getTime()-864e5).getTimezoneOffset())*6e4));
  const prevList=(a.plans[prev]||[]).filter(t=>!t.done);
  const right=h('div',{},
    h('h3',{},pd(S.day).toLocaleDateString('uk-UA',{weekday:'long',day:'numeric',month:'long'})),
    h('div',{class:'prog'},
      h('div',{class:'prog-top'},h('b',{},st.total?st.pct+'%':'—'),h('span',{},st.total?'виконано · залишилось '+(100-st.pct)+'% ('+st.done+' із '+st.total+')':'план порожній — додай завдання')),
      bar(st.pct,'big')),
    sorted.map(t=>h('div',{class:'task'+(t.done?' done':'')},
      h('input',{type:'checkbox',class:'chk',...(t.done?{checked:''}:{}),onchange:()=>commit(()=>{t.done=!t.done;act(a,'cal',(t.done?'Виконано завдання «':'Повернуто в роботу завдання «')+t.t+'» ('+fd(S.day)+')')})}),
      h('input',{type:'text',value:t.t,maxlength:'200',onchange:async e=>{const v=e.target.value.trim();if(!v){e.target.value=t.t;return}if(v===t.t)return;const old=t.t;t.t=v;act(a,'cal','Завдання змінено: «'+old+'» → «'+v+'»');await seal()}}),
      h('input',{type:'time',value:t.time||'',onchange:async e=>{t.time=e.target.value;act(a,'cal','Для завдання «'+t.t+'» '+(t.time?'встановлено час '+t.time:'час прибрано'));await seal();rerender()}}),

function svgEl(tag,attrs,...kids){const e=document.createElementNS('http://www.w3.org/2000/svg',tag);for(const k in(attrs||{}))e.setAttribute(k,attrs[k]);kids.forEach(c=>e.append(c));return e}
function chart(pts){
  const W=640,H=230,L=56,R=16,T=14,B=30;
  let min=Math.min(...pts.map(p=>p.v)),max=Math.max(...pts.map(p=>p.v));if(min===max){min=Math.max(0,min-1);max=max+1}
  const X=i=>L+(pts.length===1?0:i*(W-L-R)/(pts.length-1));
  const Y=v=>H-B-(v-min)*(H-T-B)/(max-min);
  const s=svgEl('svg',{viewBox:'0 0 '+W+' '+H,role:'img','aria-label':'Графік'});
  for(let i=0;i<=4;i++){
    const v=min+(max-min)*i/4,y=Y(v);
    s.append(svgEl('line',{class:'ch-grid',x1:L,x2:W-R,y1:y,y2:y}));
    const t=svgEl('text',{class:'ch-t',x:L-8,y:y+4,'text-anchor':'end'});t.textContent=fmt(Math.round(v));s.append(t);
  }
  const line=pts.map((p,i)=>X(i)+','+Y(p.v)).join(' ');
  s.append(svgEl('polygon',{class:'ch-area',points:X(0)+','+(H-B)+' '+line+' '+X(pts.length-1)+','+(H-B)}));
  s.append(svgEl('polyline',{class:'ch-line',points:line}));
  pts.forEach((p,i)=>{const c=svgEl('circle',{class:'ch-dot',cx:X(i),cy:Y(p.v),r:4});const t=svgEl('title',{});t.textContent=pd(p.d).toLocaleDateString('uk-UA')+': '+fmt(p.v);c.append(t);s.append(c)});
  [[0,'start'],[pts.length-1,'end']].forEach(([i,an])=>{const t=svgEl('text',{class:'ch-t',x:X(i),y:H-8,'text-anchor':pts.length===1?'middle':an});t.textContent=pd(pts[i].d).toLocaleDateString('uk-UA',{day:'numeric',month:'short'});s.append(t)});
  return s;
}
function activity(a){
  const today=new Date();today.setHours(0,0,0,0);
  const start=new Date(today);start.setDate(start.getDate()-((today.getDay()+6)%7)-77);
  const heat=h('div',{class:'heat'});
  for(let i=0;i<84;i++){
    const d=new Date(start);d.setDate(start.getDate()+i);
    if(d>today){heat.append(h('div',{class:'hc fut'}));continue}
    const n=dayStats(a,dk(d)).done;
    heat.append(h('div',{class:'hc'+(n>=4?' l3':n>=2?' l2':n>=1?' l1':''),title:d.toLocaleDateString('uk-UA')+': виконано '+n}));
  }
  let streak=0;const c=new Date(today);if(!dayStats(a,dk(c)).done)c.setDate(c.getDate()-1);
  while(dayStats(a,dk(c)).done>0){streak++;c.setDate(c.getDate()-1)}
  let week=0;for(let i=0;i<7;i++){const d=new Date(today);d.setDate(today.getDate()-i);week+=dayStats(a,dk(d)).done}
  return h('div',{class:'box'},h('h3',{},'Активність (виконані завдання, 12 тижнів)'),heat,
    h('div',{class:'note',style:'margin:0'},'Серія днів поспіль: '+streak+' · виконано за 7 днів: '+week));
}
function statForm(a,s){

// YouTube: вхід через Google (OAuth) і читання статистики власного каналу. Токен живе лише в памʼяті сторінки.
const YT_SCOPE='https://www.googleapis.com/auth/youtube.readonly https://www.googleapis.com/auth/yt-analytics.readonly';
function ytToken(hint){
  return new Promise((res,rej)=>{
    if(S.yt&&S.yt.exp>Date.now()+30000&&S.yt.hint===hint)return res(S.yt.token);
    if(!window.google||!google.accounts||!google.accounts.oauth2)return rej(new Error('Google ще не завантажився. Онови сторінку'));
    const tc=google.accounts.oauth2.initTokenClient({client_id:CFG.GOOGLE_CLIENT_ID,scope:YT_SCOPE,login_hint:hint,
      callback:r=>{if(r.error||!r.access_token)return rej(new Error(r.error==='access_denied'?'Доступ не надано':(r.error_description||r.error||'Не вдалося увійти')));
        S.yt={token:r.access_token,exp:Date.now()+(Number(r.expires_in)||3600)*1000,hint};res(r.access_token)},
      error_callback:e=>rej(new Error(e&&e.type==='popup_closed'?'Вікно входу закрито':'Не вдалося відкрити вікно Google'))});
    tc.requestAccessToken();
  });
}
async function ytGet(url,tok){
  const r=await fetch(url,{headers:{Authorization:'Bearer '+tok}});
  const j=await r.json().catch(()=>({}));
  if(!r.ok)throw new Error(j.error&&j.error.message||'Помилка '+r.status);
  return j;
}
async function ytRefresh(a){
  const btn=$('ytBtn');if(btn){btn.disabled=true;btn.textContent='Завантаження…'}
  const reset=()=>{if(btn){btn.disabled=false;btn.textContent='↻ Оновити з YouTube'}};
  try{
    const tok=await ytToken(a.email);
    const ch=await ytGet('https://www.googleapis.com/youtube/v3/channels?part=statistics,snippet&mine=true',tok);
    const c=ch.items&&ch.items[0];
    if(!c){S.yt=null;throw new Error('У цьому Google-акаунті немає каналу YouTube. Обери акаунт, до якого привʼязаний канал')}
    const want=String(a.username).replace(/^@/,'').trim().toLowerCase(),got=String(c.snippet.customUrl||'').replace(/^@/,'').toLowerCase();
    if(got&&want&&got!==want&&!confirm('Google відкрив канал «'+c.snippet.title+'» (@'+got+'), а в акаунті вказано @'+want+'. Записати його дані в цей акаунт?')){S.yt=null;throw new Error('Скасовано. Увійди в потрібний Google-акаунт')}
    const st=c.statistics,today=dk(new Date()),old=a.stats.find(x=>x.d===today)||{};
    let likes=old.likes??null,comments=old.comments??null,note='';
    try{ // лайки й коментарі (за весь час) дає YouTube Analytics; якщо не вийшло, лишаємо як було
      const rp=await ytGet('https://youtubeanalytics.googleapis.com/v2/reports?ids=channel==MINE&startDate=2005-04-23&endDate='+today+'&metrics=likes,comments',tok);
      const row=rp.rows&&rp.rows[0];if(row){likes=Number(row[0]);comments=Number(row[1])}
    }catch{note=' (лайки й коментарі не отримано: увімкни YouTube Analytics API)'}
    const rec={...old,id:old.id||uid(),d:today,subs:st.hiddenSubscriberCount?(old.subs??null):Number(st.subscriberCount),views:Number(st.viewCount),posts:Number(st.videoCount),likes,comments};
    await commit(()=>{a.stats=a.stats.filter(x=>x.d!==today);syncDaily(a,rec);a.stats.push(rec);act(a,'stat','Статистику оновлено з YouTube: підписники '+fmt(rec.subs)+', перегляди '+fmt(rec.views)+', відео '+fmt(rec.posts))});
    toast('Статистику оновлено'+note);
  }catch(e){toast('YouTube: '+(e.message||'помилка'));reset()}
}

function accountForm(a){
  const sel=h('select',{});Object.entries(PLAT).forEach(([k,v])=>{const o=h('option',{value:k},v.name);if(a&&a.platform===k)o.selected=true;sel.append(o)});
  const user=h('input',{type:'text',placeholder:'@username',value:a?.username||''});
  const mail=h('input',{type:'email',placeholder:'пошта акаунта',value:a?.email||''});
  const pass=h('input',{type:'password',autocomplete:'off',value:a?.password||''});
  const loginId=h('input',{type:'text',autocomplete:'off',placeholder:'за замовчуванням: пошта',value:a?.loginId||''});
  const notes=h('textarea',{rows:'3'},a?.notes||'');
  const link=h('input',{type:'text',placeholder:'https://www.tiktok.com/@нік (необовʼязково)',value:a?.link||''});
  const hint=h('div',{class:'note',style:'margin:6px 0 0;color:var(--ok)'});
  const normLink=raw=>{raw=String(raw).trim().replace(/[?#].*$/,'');if(!raw)return'';return /^https?:\/\//i.test(raw)?raw.replace(/^http:/i,'https:'):'https://'+raw};
  // Якщо вставлено посилання на профіль іншої платформи — перемикаємо платформу автоматично й запамʼятовуємо посилання
  const autodetect=(src)=>{
    const fld=src||user,d=detectPlatform(fld.value);if(!d)return;
    const changed=sel.value!==d.platform;
    sel.value=d.platform;
    if(d.handle){
      if(fld===user){if(!link.value.trim()&&user.value.includes('/'))link.value=normLink(user.value);user.value=d.handle}
      else if(!user.value.trim()||user.value.includes('/'))user.value=d.handle;
    }
    hint.textContent=changed?'Платформу автоматично змінено на '+PLAT[d.platform].name:(d.handle?'Нік узято з посилання':'');
  };
  user.addEventListener('paste',()=>setTimeout(()=>autodetect(user),0));
  user.addEventListener('change',()=>autodetect(user));
  link.addEventListener('paste',()=>setTimeout(()=>autodetect(link),0));
  link.addEventListener('change',()=>autodetect(link));
  dialog(a?'Редагувати акаунт':'Новий акаунт',[
    ...field('Платформа',sel),...field('Імʼя акаунта (нік або посилання на профіль)',user),hint,...field('Пошта',mail),...field('Пароль (необовʼязково)',pass),...field('Логін для входу (якщо відрізняється від пошти)',loginId),h('div',{class:'note',style:'margin:6px 0 0'},'Розширення Chrome підставить логін і пароль на сторінці входу само.'),
    ...field('Посилання на профіль (необовʼязково)',link),h('div',{class:'note',style:'margin:6px 0 0'},'Якщо кнопка «Увійти в акаунт» відкриває «профіль не знайдено», встав сюди точне посилання на свій профіль.'),
    ...field('Нотатки',notes)],
  async()=>{
    autodetect(user);
    if(!user.value.trim()||!/^\S+@\S+\.\S+$/.test(mail.value.trim()))return'Вкажи імʼя та коректну пошту';
    const ln=normLink(link.value);
    if(ln&&!validLink(ln))return'Посилання має вести на TikTok, Instagram, YouTube або Twitter (X)';
    if(ln&&detectPlatform(ln).platform!==sel.value)sel.value=detectPlatform(ln).platform;
    const data={platform:sel.value,username:user.value.trim(),email:mail.value.trim(),password:pass.value,notes:notes.value.trim(),link:ln,loginId:loginId.value.trim()};
    if(a){
      await commit(()=>{
        const ch=[];
        if(a.platform!==data.platform)ch.push('платформу ('+PLAT[a.platform].name+' → '+PLAT[data.platform].name+')');
        if(a.username!==data.username)ch.push('імʼя ('+a.username+' → '+data.username+')');
        if(a.email!==data.email)ch.push('пошту ('+a.email+' → '+data.email+')');
        if((a.password||'')!==data.password)ch.push('пароль');
        if((a.link||'')!==data.link)ch.push('посилання на профіль');
        if((a.loginId||'')!==data.loginId)ch.push('логін для входу');
        if((a.notes||'')!==data.notes)ch.push('нотатки');
        Object.assign(a,data);
        if(ch.length)act(a,'acc','Змінено: '+ch.join(', '));
      },false);
    }else{const n=ensure({id:uid(),...data});act(n,'acc','Акаунт додано ('+PLAT[n.platform].name+', '+n.username+')');S.accounts.push(n);S.sel=n.id;await seal()}
    renderTabs();render();
  });
}
$('addBtn').onclick=()=>accountForm(null);

/* ===== ІМПОРТ / ЕКСПОРТ ===== */
$('impBtn').onclick=()=>$('file').click();
$('file').onchange=async e=>{
  const f=e.target.files[0];if(!f)return;e.target.value='';
  try{
    const txt=await f.text();let rows=[];
    if(f.name.endsWith('.json')){
      const j=JSON.parse(txt);
      if(j.salt&&j.iv&&j.data){ // зашифрована резервна копія
        const pw=prompt('Майстер-пароль цієї резервної копії:');if(!pw)return;
        const salt=unb64(j.salt),key=await deriveKey(pw,salt);
        rows=JSON.parse(dec.decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(j.iv)},key,unb64(j.data))));
      }else rows=Array.isArray(j)?j:[];
    }else{
      rows=txt.split(/\r?\n/).filter(Boolean).map(l=>{const c=l.split(',').map(s=>s.trim());return{platform:c[0],username:c[1],email:c[2],password:c[3],notes:c[4]||''}});
    }
    let n=0;
    rows.forEach(r=>{let p=String(r.platform||'').toLowerCase();if(p==='x')p='twitter';if(!PLAT[p]||!r.username||!r.email)return;
      const na=ensure({id:uid(),platform:p,username:String(r.username),email:String(r.email),password:String(r.password||''),notes:String(r.notes||''),plans:r.plans,quests:r.quests,stats:r.stats,ytKey:r.ytKey,log:r.log,link:r.link});
      act(na,'acc','Акаунт імпортовано з файлу');S.accounts.push(na);n++});
    await seal();renderTabs();render();toast('Імпортовано: '+n);
  }catch{toast('Не вдалося прочитати файл')}
};
$('expBtn').onclick=()=>{
  const rec=localStorage.getItem(vaultKey());if(!rec)return;
  const a=h('a',{href:URL.createObjectURL(new Blob([rec],{type:'application/json'})),download:'agromegaa-backup.json'});
  document.body.append(a);a.click();a.remove();toast('Зашифровану копію збережено');
};

function openGuide(){
  const root=$('modalRoot'),close=()=>root.replaceChildren();
  const secs=GUIDE.map((s,i)=>{
    const d=h('details',{class:'gd',...(i===0?{open:''}:{})},h('summary',{},s.t));
    const body=h('div',{class:'gb'});
    s.b.forEach(x=>{
      if(Array.isArray(x)){const ul=h('ul',{});x.forEach(li=>{const l=h('li',{});setRich(l,li);ul.append(l)});body.append(ul)}
      else{const p=h('p',{});setRich(p,x);body.append(p)}
    });
    d.append(body);return d;
  });
  let all=false;
  const tg=h('button',{class:'btn sm',onclick:e=>{all=!all;root.querySelectorAll('details.gd').forEach(d=>{d.open=all});e.target.textContent=all?'Згорнути все':'Розгорнути все'}},'Розгорнути все');
  root.replaceChildren(h('div',{class:'modal',onclick:e=>{if(e.target.classList.contains('modal'))close()}},h('div',{class:'card wide'},
    h('div',{class:'shead'},h('h1',{style:'margin:0'},'Гайд по сайту'),h('div',{class:'sp'}),tg,h('button',{class:'btn sm',onclick:close},'✕')),
    h('p',{style:'margin:0 0 14px'},'Інструкція по кожному пункту сайту. Натисни розділ, щоб розгорнути.'),
    ...secs)));
}
// Безпечний розбір тексту: лише <b>…</b>, без innerHTML
function setRich(el,str){String(str).split(/(<b>.*?<\/b>)/g).forEach(part=>{const m=part.match(/^<b>(.*)<\/b>$/);if(m)el.append(h('b',{},m[1]));else if(part)el.append(document.createTextNode(part))})}
$('guideBtn').onclick=openGuide;$('guideAuth').onclick=openGuide;
